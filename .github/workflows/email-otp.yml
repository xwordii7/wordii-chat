name: Wordii Email OTP Backend

on:
  workflow_dispatch:
  push:
    branches:
      - feature/email-otp-v1545
    paths:
      - '.github/workflows/email-otp.yml'

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/email-otp-v1545'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wordii-email-otp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/index.js

      - name: Deploy Cloudflare Worker
        run: |
          npx wrangler deploy
          node -e 'process.stdout.write(JSON.stringify({
            BREVO_API_KEY: process.env.BREVO_API_KEY,
            FIREBASE_OTP_SERVICE_ACCOUNT: process.env.FIREBASE_OTP_SERVICE_ACCOUNT,
            OTP_HMAC_SECRET: process.env.OTP_HMAC_SECRET,
            OTP_TEST_UID: process.env.OTP_TEST_UID
          }))' | npx wrangler secret bulk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          FIREBASE_OTP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_OTP_SERVICE_ACCOUNT }}
          OTP_HMAC_SECRET: ${{ secrets.OTP_HMAC_SECRET }}
          OTP_TEST_UID: ${{ secrets.OTP_TEST_UID }}
