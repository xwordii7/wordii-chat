name: Backup Live Wordii Push Worker

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare account and Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'CHECK'
          import os, json, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4"
          account = os.environ["CF_ACCOUNT"].strip()
          token = os.environ["CF_TOKEN"].strip()
          paths = [
            "/user/tokens/verify",
            f"/accounts/{account}/workers/scripts",
            f"/accounts/{account}/workers/scripts/wordii-push"
          ]
          for path in paths:
            req = urllib.request.Request(
              base + path,
              headers={"Authorization": "Bearer " + token}
            )
            try:
              with urllib.request.urlopen(req) as r:
                data = r.read()
                print(path.split("/")[-1], "HTTP", r.status)
                if path.endswith("/scripts"):
                  obj = json.loads(data)
                  print("Workers:", [x.get("id") for x in obj.get("result", [])])
            except urllib.error.HTTPError as e:
              print(path.split("/")[-1], "HTTP", e.code)
              try:
                obj = json.loads(e.read())
                print("Errors:", obj.get("errors", []))
              except Exception:
                pass
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: wordii-push-live-backup
          path: wordii-push-live.js
          retention-days: 7
